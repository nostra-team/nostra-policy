# 방침·약관 페이지를 만들고 Pages 로 배포한다.
#
# "오늘 효력 있는 판" 은 만든 날 기준이라 **매일** 다시 만든다 — 새 판의 시행일이 되면
# 그날 첫 페이지(index.md · terms.md)가 그 판으로 바뀐다. 원본은 nostra-data 의 공개 판
# (legal/)이라 비밀 키가 필요 없다. 바뀐 게 있을 때만 커밋한다 (md · data/ — assets/*.js 는 gitignore).
name: Pages · policy

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 15 * * *'   # 매일 00:10 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # 타입이 어긋난 채로 배포하지 않는다 — 빌드 스크립트는 타입을 지우고만 돌리므로 여기서 본다
      - run: npm run typecheck
      - name: Build markdown from published legal versions
        run: npm run build
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "docs: 방침·약관 페이지 갱신 ($(TZ=Asia/Seoul date +%F))"; git push; }
      # 브라우저 스크립트(src/*.ts → assets/*.js)는 커밋하지 않는다 — 배포 직전에 만든다
      - run: npm run build:assets
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
