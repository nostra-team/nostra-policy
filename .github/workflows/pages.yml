# 방침·약관 페이지를 만들고 Pages 로 배포한다.
#
# "오늘 효력 있는 판" 은 만든 날 기준이라 **매일** 다시 만든다 — 새 판의 시행일이 되면
# 그날 첫 페이지(index.md · terms.md)가 그 판으로 바뀐다. 원본은 nostra-data 의 공개 판
# (legal/)이라 비밀 키가 필요 없다. 바뀐 게 있을 때만 커밋한다.
name: Pages · policy

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 15 * * *'   # 매일 00:10 KST
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build markdown from published legal versions
        run: python3 scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "docs: 방침·약관 페이지 갱신 ($(TZ=Asia/Seoul date +%F))"; git push; }
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
